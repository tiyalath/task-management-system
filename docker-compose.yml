services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [taskflow_mongo:/data/db]
  server:
    build: ./server
    env_file: .env
    depends_on: [mongo]
    ports: ["5000:5000"]
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on: [server]
    ports: ["5174:80"]
volumes:
  taskflow_mongo:
